			<main class="content">
                <div class="container-fluid p-0">
                  <h1 class="h3 mb-3">Crear un Quiz</h1>
              
                  <form id="quiz-form">
                    <div id="questions-container"></div>
              
                    <button type="button" class="btn btn-primary my-3" onclick="addQuestion()">Agregar Pregunta</button>
              
                    <div class="mb-3">
                      <label for="quiz-bar-type" class="form-label">Tipo de barra</label>
                      <select class="form-select" id="quiz-bar-type">
                        <option value="0">Desactivada</option>
                        <option value="1">Bonificaciones</option>
                        <option value="2">Estricto</option>
                      </select>
                    </div>
              
                    <div class="mb-3">
                      <label for="quiz-time" class="form-label">Tiempo del quiz (segundos)</label>
                      <input type="number" class="form-control" id="quiz-time" required>
                    </div>
              
                    <button type="submit" onclick="addJson()" class="btn btn-success">Guardar Quiz</button>
                  </form>
                </div>
              
                <script>
				  let file_num=111111;
                  let questionCount=0;
				  let answerCount1=0;
				  let answerCount2=0;
				  let answerCount3=0;
				  let answerCount4=0;
              
                  function addQuestion() {
                    const container = document.getElementById("questions-container");
                    const questionId = `question-${questionCount}`;
					const first_answerId= `first_answer-${answerCount1}`;
					const second_answerId=`second_answer-${answerCount2}`;
					const third_answerId=`third_answer-${answerCount3}`;
					const fourth_answerId=`fourth_answer-${answerCount4}`;
                    const html = `
                      <div class="card my-3 p-3">
                        <div class="mb-2">
                          <label class="form-label">Pregunta:</label>
                          <input id="${questionId}" type="text" class="form-control" name="question" required>
                        </div>
                        <div class="mb-2">
                          <label class="form-label">Opciones (máx 4)</label>
						  <div class="option-container">
							<input id="${first_answerId}" type="text" className="form-control mb-1" name="option1" required=true></input>
						  </div>
						  <div class="option-container">
							<input id="${second_answerId}" type="text" className="form-control mb-1" name="option2" required=true></input>
						  </div>
						  <div class="option-container">
							<input id="${third_answerId}" type="text" className="form-control mb-1" name="option3" required=true></input>
						  </div>
						  <div class="option-container">
							<input id="${fourth_answerId}" type="text" className="form-control mb-1" name="option4" required=true></input>
						  </div>
                        </div>
                        <div class="mb-2">
                          <label class="form-label">Índices de respuestas correctas (separados por coma)</label>
                          <input type="text" class="form-control" name="correctIndexes" placeholder="Ej: 0,2">
                        </div>
                        <button type="button" class="btn btn-danger btn-sm" onclick="removeQuestion('${questionId}')">Eliminar Pregunta</button>
                      </div>
                    `;
                    container.insertAdjacentHTML("beforeend", html);
                    questionCount++;
					answerCount1++;
				    answerCount2++;
				    answerCount3++;
				    answerCount4++;
                  }
              
                  function addOption(questionId) {
                    const container = document.querySelector(`#${questionId} .option-container`);
                    if (container.children.length >= 4) return alert("Máximo 4 opciones");
                    const input = document.createElement("input");
                    input.type = "text";
                    input.className = "form-control mb-1";
                    input.name = "option";
                    input.required = true;
                    container.appendChild(input);
                  }
              
                  function removeQuestion(id) {
                    document.getElementById(id).remove();
                  }
              
                  document.getElementById("quiz-form").addEventListener("submit", function (e) {
                    e.preventDefault();
              
                    const questions = Array.from(document.querySelectorAll("#questions-container > .card")).map(card => {
                      const questionText = card.querySelector("input[name='question']").value;
                      const options = Array.from(card.querySelectorAll("input[name='option']")).map(input => input.value);
                      const correctIndexes = card.querySelector("input[name='correctIndexes']").value
                        .split(',')
                        .map(i => parseInt(i.trim()))
                        .filter(i => !isNaN(i));
              
                      return { question: questionText, options, correctIndexes };
                    });
              
                    const quiz = {
                      type: parseInt(document.getElementById("quiz-bar-type").value),
                      time: parseInt(document.getElementById("quiz-time").value),
                      questions
                    };
              
                    // Aquí se podría POSTear a una API backend o guardar localmente
                    console.log(JSON.stringify(quiz, null, 2));
                    alert("Quiz generado en consola (proximamente se integrará con API/backend)");
                  });


				  function addJson(){
					const questionInputs=document.querySelectorAll('input[name="question"]');
					const qInputs=[];
					questionInputs.forEach(input => {
						if(input.value.trim()!=''){
							qInputs.push(input.value.trim());
						}
					});

					const first_answerInputs=document.querySelectorAll('input[name="option1"]');
					const a1Inputs=[];
					first_answerInputs.forEach(input => {
						if(input.value.trim()!=''){
							a1Inputs.push(input.value.trim());
						}
					});

					const second_answerInputs=document.querySelectorAll('input[name="option2"]');
					const a2Inputs=[];
					second_answerInputs.forEach(input => {
						if(input.value.trim()!=''){
							a2Inputs.push(input.value.trim());
						}
					});

					const third_answerInputs=document.querySelectorAll('input[name="option3"]');
					const a3Inputs=[];
					third_answerInputs.forEach(input => {
						if(input.value.trim()!=''){
							a3Inputs.push(input.value.trim());
						}
					});

					const fourth_answerInputs=document.querySelectorAll('input[name="option4"]');
					const a4Inputs=[];
					fourth_answerInputs.forEach(input => {
						if(input.value.trim()!=''){
							a4Inputs.push(input.value.trim());
						}
					});

					/*
					const datos={}
					rows.each(function(index){
						var obj ={
							qInputs:qInputs,
							a1Inputs:a1Inputs,
							a2Inputs:a2Inputs,
							a3Inputs:a3Inputs,
							a4Inputs:a4Inputs
						};
						datos.push(obj);
					})
					*/
					/*
					const datos={
						question:qInputs,
						correctAnswerIndex:,
						answers:[a1Inputs,a2Inputs,a3Inputs,a4Inputs]
						
					}*/
					
					const datosStr=JSON.stringify(datos, null,2);
					/*
					const fs=require('fs');
					const outputFolder=path.join(__dirname, 'componentes');
					const outputPath=path.join(outputFolder,`Quiz${Date.now()}.json`);
					

					fs.writeFile(outputPath, datosStr, (err) => {
						if(err){
							console.error('Error al crear package.json', err);
						} else{
							console.log('package.json creado exitosamente en ${outputPath}');
						}
					});
					*/
					
					const blob=new Blob([datosStr],{type:"application/json"});
					const url=URL.createObjectURL(blob);
					const a=document.createElement("a");
					a.href=url;
					a.download=`Quiz${Date.now()}.json`;
					document.body.appendChild(a);
					a.click();
					document.body.removeChild(a);
					URL.revokeObjectURL(url);

					fetch('/guardar-json', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify(datos)
					})
					.then(response => response.text())
					.then(data => {
						console.log('Respuesta del servidor:', data);
						alert('Archivo enviado y guardado correctamente.');
					})
					.catch(error => {
						console.error('Error:', error);
						alert('Error al enviar el archivo.');
					});
				  }


				  file_num++;
				
                </script>

	<script>
