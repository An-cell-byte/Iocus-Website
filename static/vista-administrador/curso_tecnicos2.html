						</div>
						<div class="card-body">
							<form action="http://s8wgo84csw8kgc0cko0ocwsk.4.172.252.35.sslip.io/upload" id="uploadForm" method="POST" enctype="multipart/form-data">

	<script src="js/app.js"></script>

	<script>
		// Cargar archivos subidos cuando se cargue la página
		document.addEventListener("DOMContentLoaded", function() {
		fetch('http://s8wgo84csw8kgc0cko0ocwsk.4.172.252.35.sslip.io/files')
			.then(res => res.json())
			.then(files => {
			const list = document.getElementById('fileList');
			files.forEach(file => {
				const li = document.createElement('li');
				li.innerHTML = `<a href="http://s8wgo84csw8kgc0cko0ocwsk.4.172.252.35.sslip.io/uploads/${file}" target="_blank">${file}</a>`;
				list.appendChild(li);
			});
			});
			// Interceptar el submit del formulario para subir archivos sin redirección
			document.getElementById('uploadForm').addEventListener('submit', async (e) => {
				e.preventDefault(); // Evita que la página se recargue
				const formData = new FormData();
				const archivo = document.querySelector('input[name="archivo"]').files[0];
				if (!archivo) {
					alert('Por favor selecciona un archivo.');
					return;
				}
				formData.append('archivo', archivo);
				try {
					const res = await fetch('http://s8wgo84csw8kgc0cko0ocwsk.4.172.252.35.sslip.io/upload', {
					method: 'POST',
					body: formData
					});

					const texto = await res.text();
					alert(texto);

					// Opcional: recargar la lista de archivos después de subir
					location.reload();
				} catch (err) {
					console.error(err);
					alert('Error al subir el archivo.');
				}

			});
		
		});
	</script>
