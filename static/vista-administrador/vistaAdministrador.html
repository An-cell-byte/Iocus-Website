 <script>

    const titulo = document.getElementById("Course_name").value;

    // ID del capacitador fijo = 99
    const id_capacitador = 99;

      String(ahora.getDate()).padStart(2, '0') + " " +
      String(ahora.getHours()).padStart(2, '0') + ":" +
      String(ahora.getMinutes()).padStart(2, '0') + ":" +
      String(ahora.getSeconds()).padStart(2, '0');

    if (!titulo || !descripcion) {
      alert("Completa todos los campos");
      return;
    }

    fetch("http://dcwck8048o4ocowkwwwkksck.4.172.252.35.sslip.io/api/capacitaciones", {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        titulo,
        descripcion,
        id_capacitador,
        fecha,
      }),
    })
      .then((res) => res.json())
      .then((data) => {
        console.log("Curso añadido:", data);
        alert("Curso añadido exitosamente");
        // Limpiar los inputs
        document.getElementById("Course_name").value = "";
        document.getElementById("course_description").value = "";
      })
      .catch((err) => {
        console.error("Error:", err);
        alert("Error al añadir curso");
      });
  }
</script>
