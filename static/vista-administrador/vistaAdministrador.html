<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Interfaz de administrador</title>

    <!-- Favicon & fonts -->
    <link rel="shortcut icon" href="img/icons/icon-48x48.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Core CSS -->
    <link href="css/app.css" rel="stylesheet" />
  </head>
  <body>
    <div class="wrapper">
      <!-- ========== Sidebar ========== -->
      <nav id="sidebar" class="sidebar js-sidebar">
        <div class="sidebar-content js-simplebar">
          <a class="sidebar-brand" href="vistaAdministrador.html">
            <span class="align-middle">Administrador</span>
          </a>

          <ul class="sidebar-nav">
            <li class="sidebar-header">Componentes</li>

            <li class="sidebar-item">
              <a class="sidebar-link" href="pages-profile2.html">
                <i class="align-middle" data-feather="user"></i>
                <span>Mi cuenta</span>
              </a>
            </li>

            <li class="sidebar-item">
              <a class="sidebar-link" href="vistaAdministrador.html">
                <i class="align-middle" data-feather="book"></i>
                <span>Cursos</span>
              </a>
            </li>

            <li class="sidebar-item">
              <a class="sidebar-link" href="ui-typography2.html">
                <i class="align-middle" data-feather="align-left"></i>
                <span>Ayuda</span>
              </a>
            </li>

            <li class="sidebar-item">
              <a class="sidebar-link" href="./../index.html">
                <i class="align-middle" data-feather="log-in"></i>
                <span>Cerrar sesión</span>
              </a>
            </li>
          </ul>
        </div>
      </nav>

      <!-- ========== Main Content ========== -->
      <div class="main">
        <!-- Top bar -->
        <nav class="navbar navbar-expand navbar-light navbar-bg">
          <a class="sidebar-toggle js-sidebar-toggle">
            <i class="hamburger align-self-center"></i>
          </a>
        </nav>

        <main class="content">
          <div class="container-fluid p-0">
            <!--div de cursos existentes-->
            <div id="root"></div>

            <script type="module" src="./main.jsx"></script>

            <!-- ===== Crear curso ===== -->
            <h2 class="h3 mb-3 mt-4">Creación de Cursos</h2>
            <div class="card">
              <div class="card-body">
                <div id="namecurso" class="mb-3">
                  <label class="form-label">Nombre del curso</label>
                  <input
                    class="form-control form-control-lg"
                    id="Course_name"
                    placeholder="Ingresa el nombre del curso"
                  />
                </div>
                <div id="descriptioncurso" class="mb-3">
                  <label class="form-label">Descripción del curso</label>
                  <input
                    class="form-control form-control-lg"
                    id="course_description"
                    placeholder="Ingresa la descripción del curso"
                  />
                </div>
                <div id="codedecurso" class="mb-3">
                  <label class="form-label">ID del curso</label>
                  <input
                    class="form-control form-control-lg"
                    id="course_id"
                    placeholder="Ingresa la descripción del curso"
                  />
                </div>
                <div class="d-grid gap-2 mt-3">
                  <button
                    onclick="añadirCurso()"
                    class="btn btn-lg btn-primary"
                  >
                    Añadir Curso
                  </button>
                </div>
              </div>
            </div>
          </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
          <div class="container-fluid">
            <div class="row text-muted">
              <div class="col-12 text-center text-lg-start">
                <p class="mb-0">
                  <strong>Whirlpool – Página de Capacitación</strong>
                </p>
              </div>
            </div>
          </div>
        </footer>
      </div>
    </div>

    <!-- Core JS -->
    <script src="js/app.js"></script>

    <!-- Script: Añadir curso dinámicamente -->
    <script>
      async function crearCurso() {
        // 1. lee los campos
        const titulo = document.getElementById("titulo").value.trim();
        const codigo = document.getElementById("codigo").value.trim();
        const descripcion = document.getElementById("descripcion").value.trim();
        const img = document.getElementById("img").value.trim();
        const link = `curso_${codigo}.html`; // o toma otro valor

        if (!titulo || !codigo || !descripcion) {
          alert("Falta llenar algo");
          return;
        }

        // 2. manda al backend
        try {
          const res = await fetch("/api/cursos", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ titulo, codigo, descripcion, img, link }),
          });

          if (!res.ok) throw new Error("error en servidor");

          alert("Curso guardado ✔");
          // opcional: limpia la forma o recarga la lista
          location.reload();
        } catch (err) {
          console.error(err);
          alert("No se pudo guardar");
        }
      }
    </script>
  </body>
</html>
