  <body>

        <!-- Footer -->

    <!-- Librería JS de AdminKit (sidebar, feather icons, etc.) -->
    <script src="js/app.js"></script>

    <!-- ====================== Lógica de la página ====================== -->
    <script>
      /* ---------- CONFIG ---------- */
      const BACKEND = "http://dcwck8048o4ocowkwwwkksck.4.172.252.35.sslip.io";

      /* ---------- helpers ---------- */
      function getCookie(nombre) {
        const fila = document.cookie
          .split("; ")
          .find((r) => r.startsWith(nombre + "="));
        return fila ? decodeURIComponent(fila.split("=")[1]) : null;
      }

      /* ---------- bloqueo por rol ---------- */
      (function protegerCapacitador() {
        const tipo = getCookie("tipo");
        if (tipo !== "capacitador") {
          if (tipo === "alumno") {
            location.replace("/vista-estudiante/coursescreen.html");
          } else {
            location.replace("/index.html");
          }
        }
      })();

      /* ---------- obtener id del curso ---------- */
      const params = new URLSearchParams(location.search);
      const courseId = params.get("id");
      if (!courseId) {
        document.getElementById("contenedorCurso").innerHTML =
          "<p>Curso no especificado.</p>";
      } else {
        cargarCurso(courseId);
      }

      /* ---------- traer y dibujar ---------- */
      async function cargarCurso(id) {
        try {
          const res = await fetch(`${BACKEND}/cursos/${id}`);
          if (!res.ok) throw new Error("No se encontró el curso");
          const curso = await res.json();
          dibujar(curso);
        } catch (err) {
          document.getElementById(
            "contenedorCurso"
          ).innerHTML = `<p>${err.message}</p>`;
        }
      }

      function dibujar(c) {
        const usuario = getCookie("tipo");
        const esCap = usuario === "capacitador";

        /* lista de material */
        let lista = "";
        (c.material || []).forEach((m) => {
          lista += `<li class="mb-1">
                      <a href="${BACKEND}/uploads/${m.ruta}" target="_blank">
                        ${m.nombre_original}
                      </a>
                    </li>`;
        });
        if (!lista) lista = "<li>No hay archivos aún</li>";

        const html = `
          <h1 class="h3 mb-3">${c.titulo}</h1>
          <p class="mb-2">${c.descripcion}</p>
          <p class="mb-4"><strong>Fecha:</strong> ${c.fecha}</p>

          <h3 class="h5">Material</h3>
          <ul class="mb-4">${lista}</ul>

          ${
            esCap
              ? `
              <div class="mb-4 d-flex gap-2">
                <button class="btn btn-sm btn-outline-primary" onclick="editarCurso(${c.id})">Editar curso</button>
                <button class="btn btn-sm btn-outline-secondary" onclick="verInscritos(${c.id})">Ver inscritos</button>
                <div id="quizDiv"></div>
                <button class="btn btn-sm btn-outline-secondary" type="quizz">Crear quiz</button>

                
              </div>
              <pre id="salidaJson"></pre>
              <h3 class="h5">Subir material</h3>
              <form id="formSubirArchivo" class="mb-3" enctype="multipart/form-data">
                <div class="input-group">
                  <input type="file" class="form-control" id="archivo" name="archivo" required />
                  <button class="btn btn-primary" type="submit">Subir</button>
                </div>
              </form>
              <p id="msg"></p>

            `
              : `<button class="btn btn-primary" onclick="iniciarCurso(${c.id})">Comenzar</button>`
          }
        `;
        document.getElementById("contenedorCurso").innerHTML = html;

        if (esCap) {
          document
            .getElementById("formSubirArchivo")
            .addEventListener("submit", (e) => subirArchivo(e, c.id));
        }
      }

      /* ---------- subir archivo ---------- */
      async function subirArchivo(e, idCurso) {
        e.preventDefault();
        const input = document.getElementById("archivo");
        const archivo = input.files[0];
        if (!archivo) return;

        const datos = new FormData();
        datos.append("archivo", archivo);

        try {
          const res = await fetch(`${BACKEND}/cursos/${idCurso}/archivos`, {
            method: "POST",
            body: datos,
          });
          if (!res.ok) throw new Error("Error al subir");
          document.getElementById("msg").textContent =
            "¡Subido! Recarga para ver el archivo.";
          input.value = "";
        } catch (err) {
          document.getElementById("msg").textContent = err.message;
        }
      }
      document.addEventListener("quizz", abrirFormularioPregunta(e));
      /* ---------- crear quiz ---------- */
      /* ---------- extras ---------- */
      function editarCurso(id) {
        alert("Ir a edición " + id);
      }
      function verInscritos(id) {
        alert("Mostrar inscritos " + id);
      }
      function iniciarCurso(id) {
        alert("Lanzar contenido " + id);
      }
      function crearQuiz(id) {
        alert("Crear quiz " + id);
      }
    </script>
    <script>
      // 🔹Array donde guardaremos todas las preguntas
      const bancoPreguntas = [];

      /*-------------------------------------------------
    Muestra el formulario dentro de #quizDiv
  -------------------------------------------------*/
      function abrirFormularioPregunta() {
        const contenedor = document.getElementById("quizDiv");

        // 👇 Insertamos el formulario con 5 inputs y radios para marcar la correcta
        contenedor.innerHTML = `
      <div id="formPregunta" style="border:1px solid #ccc;padding:1rem;margin-top:1rem;">
        <label>Pregunta:
          <input type="text" id="inputPregunta" placeholder="Escribe la pregunta" />
        </label><br><br>

        ${[0, 1, 2, 3]
          .map(
            (i) => `
          <div style="margin-bottom:.5rem;">
            <input type="radio" name="correcta" value="${i}" id="radio${i}"/>
            <input type="text" id="resp${i}" placeholder="Respuesta ${i + 1}" />
          </div>
        `
          )
          .join("")}

        <button id="btnListo">Listo</button>
        <button id="btnSiguiente">Siguiente pregunta</button>
      </div>
    `;

        // 🎯 Eventos de los botones
        document
          .getElementById("btnListo")
          .addEventListener("click", guardarPregunta);
        document
          .getElementById("btnSiguiente")
          .addEventListener("click", limpiarFormulario);
      }

      /*-------------------------------------------------
    Crea el objeto-pregunta y lo mete en bancoPreguntas
  -------------------------------------------------*/
      function guardarPregunta(e) {
        e.preventDefault(); // evita que el botón recargue la página

        const pregunta = document.getElementById("inputPregunta").value.trim();
        const respuestas = [0, 1, 2, 3].map((i) =>
          document.getElementById("resp" + i).value.trim()
        );

        // índice de la respuesta correcta
        const radioMarcado = document.querySelector(
          'input[name="correcta"]:checked'
        );
        const indiceCorrecto = radioMarcado ? Number(radioMarcado.value) : -1;

        // 🛑 Validación rápida
        if (!pregunta || respuestas.some((r) => !r) || indiceCorrecto === -1) {
          alert("Llena todo y marca cuál respuesta es la correcta 😉");
          return;
        }

        // Objeto tal cual tu formato de ejemplo
        bancoPreguntas.push({
          question: pregunta,
          correctAnswerIndex: indiceCorrecto,
          answers: respuestas,
        });

        // Muestra el JSON en pantalla para que veas el avance
        document.getElementById("salidaJson").textContent = JSON.stringify(
          bancoPreguntas,
          null,
          2
        );

        alert("¡Pregunta guardada!");
      }

      /*-------------------------------------------------
    Limpia el formulario para otra pregunta
  -------------------------------------------------*/
      function limpiarFormulario() {
        document.getElementById("inputPregunta").value = "";
        [0, 1, 2, 3].forEach((i) => {
          document.getElementById("resp" + i).value = "";
          document.getElementById("radio" + i).checked = false;
        });
      }
    </script>
  </body>
