<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Curso</title>
  </head>
  <body>
    <div id="contenedorCurso"></div>

    <script>
      // 1)  Protección por rol
      function getCookie(nombre) {
        const fila = document.cookie
          .split("; ")
          .find((row) => row.startsWith(nombre + "="));

        // Si existe la cookie → devuelve el valor decodificado; si no, null
        return fila ? decodeURIComponent(fila.split("=")[1]) : null;
      }

      /* 2. IIFE que protege toda la página */
      (function protegerCapacitador() {
        const tipo = getCookie("tipo"); // 'capacitador', 'alumno' o null

        // Si no es capacitador, lo sacamos ⬇
        if (tipo !== "capacitador") {
          if (tipo === "alumno") {
            // Usuario logueado pero sin permisos
            window.location.replace("/vista-estudiante/coursescreen.html");
          } else {
            // Sin sesión o cookie corrupta
            window.location.replace("/index.html");
          }
          return; // detenemos el resto del script
        }

        /* 3. Si llega aquí, SÍ es capvacitador → la página puede cargar normal */
      })();

      // 2)  Obtener ID del curso desde la URL
      const params = new URLSearchParams(location.search);
      const courseId = params.get("id");
      if (!courseId) {
        document.body.innerHTML = "<p>Curso no especificado.</p>";
      } else {
        cargarCurso(courseId);
      }

      // 3)  Pedir datos al backend y pintarlos
      async function cargarCurso(id) {
        try {
          const res = await fetch(`/cursos/${id}`);
          if (!res.ok) throw new Error("No se encontró el curso");
          const curso = await res.json();
          dibujar(curso);
        } catch (err) {
          document.body.innerHTML = `<p>${err.message}</p>`;
        }
      }

      // 4)  Render según rol
      function dibujar(c) {
        const usuario = JSON.parse(localStorage.getItem("usuario"));
        const esCap = usuario.rol === "capacitador";

        const html = `
    <h1>${c.titulo}</h1>
    <p>${c.descripcion}</p>
    <p><strong>Fecha:</strong> ${c.fecha}</p>

    ${
      esCap
        ? `
        <!-- Botones de gestión -->
        <button onclick="editarCurso(${c.id})">Editar curso</button>
        <button onclick="verInscritos(${c.id})">Ver inscritos</button>

        <!-- Formulario de subida -->
        <h2>Subir material</h2>
        <form id="formSubirArchivo" enctype="multipart/form-data">
          <input type="file" id="archivo" name="archivo" required />
          <button type="submit">Subir</button>
        </form>
        <p id="msg"></p>
        `
        : `<button onclick="iniciarCurso(${c.id})">Comenzar</button>`
    }
  `;
        document.getElementById("contenedorCurso").innerHTML = html;

        if (esCap) {
          // engancha el submit después de inyectar el HTML
          document
            .getElementById("formSubirArchivo")
            .addEventListener("submit", (e) => subirArchivo(e, c.id));
        }
      }
      async function subirArchivo(evento, idCurso) {
        evento.preventDefault();
        const input = document.getElementById("archivo");
        const archivo = input.files[0];
        if (!archivo) return;

        // empaqueta el archivo en FormData
        const datos = new FormData();
        datos.append("archivo", archivo);

        try {
          const res = await fetch(`/cursos/${idCurso}/archivos`, {
            method: "POST",
            body: datos, // no definas Content-Type, el browser lo pone
          });
          if (!res.ok) throw new Error("Error al subir");
          document.getElementById("msg").textContent = "¡Subido!";
          input.value = ""; // limpia el campo
        } catch (err) {
          document.getElementById("msg").textContent = err.message;
        }
      }

      /* Ejemplos de funciones extras */
      function editarCurso(id) {
        alert("Ir a pantalla de edición " + id);
      }
      function verInscritos(id) {
        alert("Mostrar inscritos " + id);
      }
      function iniciarCurso(id) {
        alert("Lanzar contenido del curso " + id);
      }
    </script>
  </body>
</html>
