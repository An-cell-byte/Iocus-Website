    <!-- ================= CUSTOM SCRIPT ================= -->
    <script type="module">
      // 1. Utilidad para cookies -------------------------------------------
      function getCookie(nombre) {
        const fila = document.cookie
          .split("; ")
          .find((row) => row.startsWith(nombre + "="));
        return fila ? decodeURIComponent(fila.split("=")[1]) : null;
      }

      // 2. Protección de ruta ----------------------------------------------
      (function proteger() {
        const token = getCookie("token");
        const usuario = JSON.parse(localStorage.getItem("usuario") || "null");
        const esVistaCap = location.pathname.includes("/vista-administrador");

        if (!token || !usuario) {
          location.href = "/login.html";
          return;
        }
        if (esVistaCap && usuario.tipo !== "capacitador") {
          location.href = "/vista-estudiante/coursescreen.html";
          return;
        }
        if (!esVistaCap && usuario.tipo !== "alumno") {
          location.href = "/vista-administrador/vistaAdministrador.html";
          return;
        }
      })();

      // 3. Obtener ID del curso -------------------------------------------
      const params = new URLSearchParams(location.search);
      const courseId = params.get("id");

      if (!courseId) {
        document.getElementById("contenedorCurso").innerHTML =
          '<p class="text-center">Curso no especificado.</p>';
      } else {
        cargarCurso(courseId);
      }

      // 4. Traer datos desde backend --------------------------------------
      async function cargarCurso(id) {
        try {
          const res = await fetch(`/cursos/${id}`);
          if (!res.ok) throw new Error("No se encontró el curso");
          const curso = await res.json();
          dibujar(curso);
        } catch (err) {
          document.getElementById(
            "contenedorCurso"
          ).innerHTML = `<p class='text-center'>${err.message}</p>`;
        }
      }

      // 5. Dibujar la tarjeta ---------------------------------------------
      function dibujar(c) {
        const usuario = JSON.parse(localStorage.getItem("usuario"));
        const esCap = usuario.tipo === "capacitador";

        const botones = esCap
          ? `<button class="btn btn-primary me-2" onclick="editarCurso(${c.id})">Editar curso</button>
             <button class="btn btn-secondary" onclick="verInscritos(${c.id})">Ver inscritos</button>`
          : `<button class="btn btn-success" onclick="iniciarCurso(${c.id})">Comenzar</button>`;

        document.getElementById("contenedorCurso").innerHTML = `
          <div class="col-md-8 col-lg-6">
            <div class="card">
              <div class="card-header"><h3 class="card-title mb-0">${
                c.titulo
              }</h3></div>
              <div class="card-body">
                <p class="mb-2">${c.descripcion}</p>
                <p class="text-muted mb-4"><strong>Fecha de creación:</strong> ${new Date(
                  c.fecha
                ).toLocaleString()}</p>
                ${botones}
              </div>
            </div>
          </div>`;
      }

      // 6. Funciones dummy -------------------------------------------------
      window.editarCurso = (id) => alert("Ir a pantalla de edición " + id);
      window.verInscritos = (id) => alert("Mostrar inscritos " + id);
      window.iniciarCurso = (id) => alert("Lanzar contenido del curso " + id);
    </script>
