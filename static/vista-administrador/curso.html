<!DOCTYPE html>
<html lang="es">
  <head>
    <!-- Protección de ruta -->
    <script src="protegerCapacitador.js"></script>

    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

      rel="stylesheet"
    />
    <link href="css/app.css" rel="stylesheet" />

    <style>
      #msg {
        color: #198754;
        font-weight: 600;
      }
      #tarjetas {
        display: grid;
        gap: 1rem;
      }
      .tarjeta {
        padding: 1rem;
        border: 1px solid #ccc;
        border-radius: 0.5rem;
      }
      .tarjeta h3 {
        margin-top: 0;
      }
      .borrar {
        margin-top: 0.5rem;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <!-- ========== Sidebar ========== -->
      <nav id="sidebar" class="sidebar js-sidebar">
        <div class="sidebar-content js-simplebar">
          <a class="sidebar-brand" href="vistaAdministrador.html"
            ><span class="align-middle">Administrador</span></a
          >
          <ul class="sidebar-nav">
            <li class="sidebar-header">Componentes</li>
            <li class="sidebar-item">
              <a class="sidebar-link" href="pages-profile2.html"
                ><i class="align-middle" data-feather="user"></i
                ><span>Mi cuenta</span></a
              >
            </li>
            <li class="sidebar-item active">
              <a class="sidebar-link" href="vistaAdministrador.html"
                ><i class="align-middle" data-feather="book"></i
                ><span>Cursos</span></a
              >
            </li>
            <li class="sidebar-item">
              <a class="sidebar-link" href="ui-typography2.html"
                ><i class="align-middle" data-feather="align-left"></i
                ><span>Ayuda</span></a
              >
            </li>
            <li class="sidebar-item">
              <a class="sidebar-link" href="../index.html"
                ><i class="align-middle" data-feather="log-in"></i
                ><span>Cerrar sesión</span></a
              >
            </li>
          </ul>
        </div>
      </nav>

      <!-- ========== Main Content ========== -->
      <div class="main">
        <nav class="navbar navbar-expand navbar-light navbar-bg">
          <a class="sidebar-toggle js-sidebar-toggle"
            ><i class="hamburger align-self-center"></i
          ></a>
        </nav>

        <main class="content">
          <div class="container-fluid p-0">
            <div id="contenedorCurso"></div>
          </div>
        </main>

        <footer class="footer">
          <div class="container-fluid">
            <div class="row text-muted">
              <div class="col-12 text-center text-lg-start">
                <p class="mb-0">
                  <strong>Whirlpool – Página de Capacitación</strong>
                </p>
              </div>
            </div>
          </div>
        </footer>
      </div>
    </div>

    <script src="js/app.js"></script>

    <script>
      /* ---------- CONFIG ---------- */
      const BACKEND = "http://dcwck8048o4ocowkwwwkksck.4.172.252.35.sslip.io";

      /* ---------- helpers ---------- */
      function getCookie(nombre) {
        const fila = document.cookie
          .split("; ")
          .find((r) => r.startsWith(nombre + "="));
        return fila ? decodeURIComponent(fila.split("=")[1]) : null;
      }

      /* ---------- bloqueo por rol ---------- */
      (function protegerCapacitador() {
        const tipo = getCookie("tipo");
        if (tipo !== "capacitador") {
          if (tipo === "alumno")
            location.replace("/vista-estudiante/coursescreen.html");
          else location.replace("/index.html");
        }
      })();

      /* ---------- obtener id y cargar curso ---------- */
      const params = new URLSearchParams(location.search);
      const cursoId = params.get("id");
      if (!cursoId) {
        document.getElementById("contenedorCurso").innerHTML =
          "<p>Curso no especificado.</p>";
      } else {
        cargarCurso(cursoId);
      }

      /* ---------- carga curso + pinta + carga quiz ---------- */
      async function cargarCurso(id) {
        try {
          const res = await fetch(`${BACKEND}/cursos/${id}`);
          if (!res.ok) throw new Error("No se encontró el curso");
          const curso = await res.json();
          dibujar(curso); // pinta la página
          obtenerQuizExistente(id); // y AHORA sí, carga el quiz
        } catch (err) {
          document.getElementById(
            "contenedorCurso"
          ).innerHTML = `<p>${err.message}</p>`;
        }
      }

      function dibujar(c) {
        const esCap = getCookie("tipo") === "capacitador";

        /* lista de material */
        const lista =
          (c.material || [])
            .map(
              (m) => `
      <li class="mb-1"><a href="${BACKEND}/uploads/${m.ruta}" target="_blank">${m.nombre_original}</a></li>`
            )
            .join("") || "<li>No hay archivos aún</li>";

        document.getElementById("contenedorCurso").innerHTML = `
    <h1 class="h3 mb-3">${c.titulo}</h1>
    <p class="mb-2">${c.descripcion}</p>
    <p class="mb-4"><strong>Id del Curso:</strong> ${id}</p>
    <p class="mb-4"><strong>Fecha:</strong> ${c.fecha}</p>

    <h3 class="h5">Material</h3>
    <ul class="mb-4">${lista}</ul>

    ${
      esCap
        ? `
    <div class="mb-4 d-flex gap-2">
      <button class="btn btn-sm btn-outline-primary" onclick="editarCurso(${c.id})">Editar curso</button>
      <button class="btn btn-sm btn-outline-secondary" onclick="verInscritos(${c.id})">Ver inscritos</button>
      <button class="btn btn-sm btn-outline-secondary" onclick="abrirFormularioPregunta()">Crear quiz</button>
    </div>
    <div id="quizDiv"></div>
    <div id="tarjetas"></div>
    <pre id="salidaJson"></pre>

    <h3 class="h5">Subir material</h3>
    <form id="formSubirArchivo" class="mb-3" enctype="multipart/form-data">
      <div class="input-group">
        <input type="file" class="form-control" id="archivo" name="archivo" required />
        <button class="btn btn-primary" type="submit">Subir</button>
      </div>
    </form>
    <p id="msg"></p>
    `
        : `<button class="btn btn-primary" onclick="iniciarCurso(${c.id})">Comenzar</button>`
    }
  `;

        if (esCap) {
          document
            .getElementById("formSubirArchivo")
            .addEventListener("submit", (e) => subirArchivo(e, c.id));
        }
      }

      /* ---------- subir archivo ---------- */
      async function subirArchivo(e, idCurso) {
        e.preventDefault();
        const input = document.getElementById("archivo");
        const archivo = input.files[0];
        if (!archivo) return;

        const datos = new FormData();
        datos.append("archivo", archivo);

        try {
          const res = await fetch(`${BACKEND}/cursos/${idCurso}/archivos`, {
            method: "POST",
            body: datos,
          });
          if (!res.ok) throw new Error("Error al subir");
          document.getElementById("msg").textContent =
            "¡Subido! Recarga para ver el archivo.";
          input.value = "";
        } catch (err) {
          document.getElementById("msg").textContent = err.message;
        }
      }

      /* ---------- extras ---------- */
      function editarCurso(id) {
        alert("Ir a edición " + id);
      }
      function verInscritos(id) {
        alert("Mostrar inscritos " + id);
      }
      function iniciarCurso(id) {
        alert("Lanzar contenido " + id);
      }
    </script>

    <!-- ====================== QUIZ ====================== -->
    <script>
      const bancoPreguntas = [];

      /* ------ muestra formulario para nueva pregunta ------ */
      function abrirFormularioPregunta() {
        document.getElementById("quizDiv").innerHTML = `
          <div id="formPregunta" style="border:1px solid #ccc;padding:1rem;margin-top:1rem;">
            <label>Pregunta:
              <input type="text" id="inputPregunta" placeholder="Escribe la pregunta" />
            </label><br><br>
            ${[0, 1, 2, 3]
              .map(
                (i) => `
              <div style="margin-bottom:.5rem;">
                <input type="radio" name="correcta" value="${i}" id="radio${i}" />
                <input type="text" id="resp${i}" placeholder="Respuesta ${
                  i + 1
                }" />
              </div>`
              )
              .join("")}
            <button id="btnListo">Guardar Pregunta</button>
            <button id="mandarFormulario">Mandar Preguntas</button>
          </div>`;
        document
          .getElementById("btnListo")
          .addEventListener("click", guardarPregunta);
        document
          .getElementById("mandarFormulario")
          .addEventListener("click", mandarformulario);
      }

      /* ------ guarda la pregunta en array ------ */
      function guardarPregunta(e) {
        e.preventDefault();
        const pregunta = document.getElementById("inputPregunta").value.trim();
        const respuestas = [0, 1, 2, 3].map((i) =>
          document.getElementById("resp" + i).value.trim()
        );
        const radio = document.querySelector('input[name="correcta"]:checked');
        const idx = radio ? +radio.value : -1;

        if (!pregunta || respuestas.some((r) => !r) || idx === -1) {
          alert("Llena todo y marca la correcta 😉");
          return;
        }
        bancoPreguntas.push({ pregunta, correctAnswerIndex: idx, respuestas });
        // document.getElementById("salidaJson").textContent = JSON.stringify(
        //   bancoPreguntas,
        //   null,
        //   2
        //);
        // limpia
        document.getElementById("inputPregunta").value = "";
        [0, 1, 2, 3].forEach((i) => {
          document.getElementById("resp" + i).value = "";
          document.getElementById("radio" + i).checked = false;
        });
      }

      /* ------ envía todo el quiz ------ */
      function mandarformulario() {
        fetch(`${BACKEND}/api/capacitaciones/${cursoId}/preguntas`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(bancoPreguntas),
        })
          .then((r) => {
            if (!r.ok) throw new Error("Error al enviar");
          })
          .then(() => {
            alert("Enviado con éxito");
            bancoPreguntas.length = 0;
            document.getElementById("salidaJson").textContent = "";
          })
          .catch((e) => alert(e.message));
      }
      const idCapacitacion = params.get("id");
      /* ------ pinta tarjetas ------ */
      function mostrarTarjetas(lista) {
        const cont = document.getElementById("tarjetas");
        if (!cont) return; // por si el contenedor aún no existe
        cont.innerHTML = "";

        lista.forEach((item) => {
          const div = document.createElement("div");
          div.className = "tarjeta";
          div.innerHTML = `
            <h3>${item.pregunta}</h3>
            <ul>
              ${item.respuestas
                .map((r, idx) =>
                  idx === item.correctAnswerIndex
                    ? `<li><strong>${r}</strong> ✅</li>`
                    : `<li>${r}</li>`
                )
                .join("")}
            </ul>
            <button class="borrar">Borrar</button>
          `;

          /* 2️⃣ Al pulsar "Borrar" se llama a la API */
          div.querySelector(".borrar").addEventListener("click", async () => {
            try {
              // nombre / pregunta se codifica por si lleva espacios
              const url = `${BACKEND}/api/quiz/${idCapacitacion}/${encodeURIComponent(
                item.pregunta
              )}`;

              const res = await fetch(url, { method: "DELETE" });

              if (!res.ok) {
                const err = await res.text();
                throw new Error(err || "Error al borrar");
              }

              // 3️⃣ Si todo salió bien, quitamos la tarjeta del DOM
              div.remove();
              console.log("Pregunta eliminada correctamente");
            } catch (e) {
              alert("No se pudo borrar la pregunta: " + e.message);
            }
          });

          cont.appendChild(div);
        });
      }

      /* ------ trae quiz ya guardado ------ */
      function obtenerQuizExistente(id) {
        fetch(`${BACKEND}/quiz/${id}`)
          .then((r) => {
            if (!r.ok) throw new Error("No se encontró el quiz");
            return r.json();
          })
          .then((data) => {
            if (data.length) mostrarTarjetas(data);
          })
          .catch(console.error);
      }
    </script>
  </body>
</html>
