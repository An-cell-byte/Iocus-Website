	<script>
		// Aquí puedes agregar el código JavaScript que necesites para la funcionalidad de tu página
		function añadirCurso() {
			// Lógica para añadir un curso
			alert("Curso añadido exitosamente.");
			fetch("http://dcwck8048o4ocowkwwwkksck.4.172.252.35.sslip.io/api/inscribir/:id_usuario/:id_capacitacion" , {
				method: "POST",
				headers: {
					"Content-Type": "application/json",
				},
				body: JSON.stringify({
					id_usuario: 1,
					id_capacitacion: document.getElementById("codedecurso").value,
				}),
			})
				.then((response) => {
					if (response.ok) {
						alert("Curso añadido exitosamente.");
					} else {
						alert("Error al añadir el curso.");
					}
				})
				.catch((error) => {
					console.error("Error:", error);
				});
			
		}
	</script>
