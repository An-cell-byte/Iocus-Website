<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta
      name="description"
      content="Responsive Admin &amp; Dashboard Template based on Bootstrap 5"
    />
    <meta name="author" content="AdminKit" />
    <meta
      name="keywords"
      content="adminkit, bootstrap, bootstrap 5, admin, dashboard, template, responsive, css, sass, html, theme, front-end, ui kit, web"
    />

    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link rel="shortcut icon" href="img/icons/icon-48x48.png" />
    <link
      rel="canonical"
      href="https://demo-basic.adminkit.io/pages-sign-in.html"
    />

    <title>Inicio de sesión</title>

    <!-- Estilos -->
    <link href="css/app.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Contenido -->
    <main class="d-flex w-100">
      <div class="container d-flex flex-column">
        <div class="row vh-100">
          <div
            class="col-sm-10 col-md-8 col-lg-6 col-xl-5 mx-auto d-table h-100"
          >
            <div class="d-table-cell align-middle">
              <!-- Logo -->
              <div class="text-center mt-4">
                <img
                  src="img/IMG2whirlpool.jpg"
                  alt="Avatar"
                  style="width: 40%"
                />
                <br /><br /><br />
              </div>

              <!-- Formulario -->
              <div class="card">
                <div class="card-body">
                  <div class="m-sm-3">
                    <form id="login-form">
                      <div class="mb-3">
                        <label class="form-label">Nombre de usuario</label>
                        <input
                          id="correo"
                          class="form-control form-control-lg"
                          type="email"
                          name="correo"
                          placeholder="Ingresa tu nombre de usuario"
                        />
                      </div>
                      <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input
                          id="contrasena"
                          class="form-control form-control-lg"
                          type="password"
                          name="contrasena"
                          placeholder="Ingresa tu contraseña"
                        />
                      </div>

                      <div class="d-grid gap-2 mt-3">
                        <!-- Para pruebas rápidas usa el enlace;
												  al pasar a producción cambia por <button type="submit"> -->
                        <button class="btn btn-lg btn-primary" type="submit">
                          Inicio de sesión
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
              <!-- Fin formulario -->
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      document
        .getElementById("login-form")
        .addEventListener("submit", handleLogin);

      async function handleLogin(e) {
        e.preventDefault(); // ← ahora sí tenemos el evento

        const correo = document.getElementById("correo").value.trim();
        const contrasena = document.getElementById("contrasena").value.trim();

        if (!correo || !contrasena) {
          return alert("Completa ambos campos");
        }

        const url = `http://dcwck8048o4ocowkwwwkksck.4.172.252.35.sslip.io/usario/${encodeURIComponent(
          correo
        )}/${encodeURIComponent(contrasena)}`;

        try {
          const res = await fetch(url); // ⏳ esperamos la respuesta
          if (!res.ok) throw new Error("Credenciales incorrectas");

          const usuario = await res.json(); // 🎉 {id, nombre, correo, tipo, …}
          console.log("Respuesta API:", usuario);

          if (!usuario.id) {
            alert("Respuesta inválida del servidor");
            return;
          }

          setUserCookiesForever(usuario);

          // redirección por rol
          if (usuario.tipo === "capacitador") {
            location.href = "/vista-administrador/vistaAdministrador.html";
          } else if (usuario.tipo === "alumno") {
            location.href = "/vista-estudiante/coursescreen.html";
          } else {
            location.href = "/no-autorizado.html";
          }
        } catch (err) {
          console.error(err);
          alert("Error en la autenticación. Inténtalo de nuevo.");
        }
      }

      /* ------ cookies “para siempre” (≈ 68 años) ------ */
      function setUserCookiesForever(user) {
        const claves = ["id", "nombre", "correo", "tipo"];
        const forever = 2147483647; // segundos

        claves.forEach((c) => {
          const valor = encodeURIComponent(user[c]);
          document.cookie = `${c}=${valor}; max-age=${forever}; path=/; SameSite=Lax`;
        });
      }
    </script>
  </body>
</html>
