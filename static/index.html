<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta
      name="description"
      content="Responsive Admin &amp; Dashboard Template based on Bootstrap 5"
    />
    <meta name="author" content="AdminKit" />
    <meta
      name="keywords"
      content="adminkit, bootstrap, bootstrap 5, admin, dashboard, template, responsive, css, sass, html, theme, front-end, ui kit, web"
    />

    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link rel="shortcut icon" href="img/icons/icon-48x48.png" />
    <link
      rel="canonical"
      href="https://demo-basic.adminkit.io/pages-sign-in.html"
    />

    <title>Inicio de sesión</title>

    <!-- Estilos -->
    <link href="css/app.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Contenido -->
    <main class="d-flex w-100">
      <div class="container d-flex flex-column">
        <div class="row vh-100">
          <div
            class="col-sm-10 col-md-8 col-lg-6 col-xl-5 mx-auto d-table h-100"
          >
            <div class="d-table-cell align-middle">
              <!-- Logo -->
              <div class="text-center mt-4">
                <img
                  src="img/IMG2whirlpool.jpg"
                  alt="Avatar"
                  style="width: 40%"
                />
                <br /><br /><br />
              </div>

              <!-- Formulario -->
              <div class="card">
                <div class="card-body">
                  <div class="m-sm-3">
                    <form id="login-form">
                      <div class="mb-3">
                        <label class="form-label">Nombre de usuario</label>
                        <input
                          id="correo"
                          class="form-control form-control-lg"
                          type="email"
                          name="correo"
                          placeholder="Ingresa tu nombre de usuario"
                        />
                      </div>
                      <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input
                          id="contrasena"
                          class="form-control form-control-lg"
                          type="password"
                          name="contrasena"
                          placeholder="Ingresa tu contraseña"
                        />
                      </div>

                      <div class="d-grid gap-2 mt-3">
                        <!-- Para pruebas rápidas usa el enlace;
												  al pasar a producción cambia por <button type="submit"> -->
                        <button
                          class="btn btn-lg btn-primary"
                          type="submit"
                          onclick="handleLogin()"
                        >
                          Inicio de sesión
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
              <!-- Fin formulario -->
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      /* ========= FUNCIÓN login() QUE YA HICIMOS ========= */
      const API_BASE = "http://dcwck8048o4ocowkwwwkksck.4.172.252.35.sslip.io";
      async function login(user, password) {
        try {
          // 1️⃣ Llamada al backend
          const url = `${API_BASE}/usuario/${encodeURIComponent(
            user
          )}/${encodeURIComponent(password)}`;
          const res = await fetch(url);

          // 2️⃣ Manejo de errores
          if (!res.ok) {
            const msg = await res.text();
            alert(`Error: ${msg}`);
            return;
          }

          // 3️⃣ Usuario válido
          const data = await res.json(); // Aquí viene correo, rol, etc.
          const token = crypto.randomUUID(); // Token “rápido” (o usa el que devuelva tu API)

          // 4️⃣ Guardar sesión
          localStorage.setItem("token", token);
          localStorage.setItem("usuario", JSON.stringify(data));
          localStorage.setItem("loginTime", Date.now());

          console.log("usuario correcto");

          /* 5️⃣ Redirección según rol  */
          // Supongamos que data.rol vale 'capacitador' o 'alumno'
          if (data.rol === "capacitador") {
            window.location.href =
              "/vista-administrador/vistaAdministrador.html";
          } else if (data.rol === "alumno") {
            window.location.href = "/vista-estudiante/coursescreen.html";
          } else {
            // Rol desconocido → página genérica o error
            window.location.href = "/no-autorizado.html";
          }
        } catch (e) {
          console.error("Fallo al contactar al servidor:", e);
          alert("No se pudo contactar al servidor. Intenta más tarde.");
        }
      }

      /* ========= AQUÍ LLAMAMOS A login() ========= */
      async function handleLogin() {
        const user = document.getElementById("correo").value.trim();
        const pass = document.getElementById("contrasena").value.trim();
        login(user, pass); // ← aquí llamas a la función
      }
    </script>
  </body>
</html>
